<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);

    }

    .login-container h1 {
      text-align: center;
      color:blue;
      margin-bottom: 40px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #444;
      font-weight: bold;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .back-btn {
      background: #eee;
      color: #444;
    }

    .back-btn:hover {
      background: #ddd;
    }

    .proceed-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .proceed-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .message {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h1>Create Account</h1>

    <form id="loginForm">

      <div class="input-group">
        <label for="username">Name or Number</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your Name or Number"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="buttons">
        <button type="button" class="back-btn" onclick="goBack()">
          Back
        </button>

        <button type="submit" class="proceed-btn"><a href="home page.html" style="color: white; text-decoration: none;">Continue</a>
        </button>
      </div>

      <p class="message" id="message"></p>

    </form>
  </div>
  <script>
    function goBack() {
      window.history.back();
    }

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;

      document.getElementById("message").textContent =
        "Welcome, " + username + "! Form submitted. Go Back To LOG IN!";
    });
  </script>

</body>
</html>
